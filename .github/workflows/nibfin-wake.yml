name: Nibfin adopted Action wake
# Core source: 130d61d04afac216be0b2235059cd1248672ca9b
on:
  workflow_dispatch:
    inputs:
      issue_number: { required: true, type: string }
      issue_id: { required: true, type: string }
      repository_id: { required: true, type: string }
permissions:
  contents: read
  id-token: write
concurrency:
  group: nibfin-${{ github.repository_id }}-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  adopted-stage:
    runs-on: [self-hosted, Linux, nibfin-user-127829492]
    steps:
      - uses: "taco3064/nibfin-act@\
          e26fe67cf084ca482e2736980c19e537c8da004d"
        with:
          issue-number: ${{ inputs.issue_number }}
          stage: continue
