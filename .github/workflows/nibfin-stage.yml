name: Nibfin adopted stage
on:
  workflow_dispatch:
    inputs:
      issue-number: { required: true, type: string }
      stage: { required: true, type: string }
permissions:
  contents: read
  id-token: write
jobs:
  adopted-stage:
    runs-on: [self-hosted, nibfin-user-127829492]
    steps:
      - uses: taco3064/nibfin-act@44966d02d644c0f67360cab6f71677fe33f1b3e4
        with:
          issue-number: ${{ inputs.issue-number }}
          stage: ${{ inputs.stage }}
