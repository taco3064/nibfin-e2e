name: Nibfin adopted stage
on:
  workflow_dispatch:
    inputs:
      issue-number: { required: true, type: string }
      stage: { required: true, type: string }
permissions:
  contents: read
  id-token: write
jobs:
  adopted-stage:
    runs-on: [self-hosted, nibfin-user-127829492]
    steps:
      - uses: taco3064/nibfin-act@f7fdf5e051a7c59890eec9a6047eec511c2d20d2
        with:
          issue-number: ${{ inputs.issue-number }}
          stage: ${{ inputs.stage }}
