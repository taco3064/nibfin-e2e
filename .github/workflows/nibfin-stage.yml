name: Nibfin adopted stage
on:
  workflow_dispatch:
    inputs:
      issue-number: { required: true, type: string }
      stage: { required: true, type: string }
permissions:
  contents: read
  id-token: write
jobs:
  adopted-stage:
    runs-on: [self-hosted, nibfin-user-127829492]
    steps:
      - uses: taco3064/nibfin-act@522cb1328151a40d038f823a8780a1623a2466ff
        with:
          issue-number: ${{ inputs.issue-number }}
          stage: ${{ inputs.stage }}
