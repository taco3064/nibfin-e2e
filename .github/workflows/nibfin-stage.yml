name: Nibfin adopted stage
on:
  workflow_dispatch:
    inputs:
      issue-number: { required: true, type: string }
      stage: { required: true, type: string }
permissions:
  contents: read
  id-token: write
jobs:
  adopted-stage:
    runs-on: [self-hosted, nibfin-user-127829492]
    steps:
      - uses: taco3064/nibfin-act@a82e3c2d587758d32e443124e3c322c7c35f4044
        with:
          issue-number: ${{ inputs.issue-number }}
          stage: ${{ inputs.stage }}
