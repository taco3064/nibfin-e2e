name: Nibfin adopted stage
on:
  workflow_dispatch:
    inputs:
      issue-number: { required: true, type: string }
      stage: { required: true, type: string }
permissions:
  contents: read
  id-token: write
jobs:
  adopted-stage:
    runs-on: [self-hosted, nibfin-user-127829492]
    steps:
      - uses: taco3064/nibfin-act@a7526cc3b2d1ac327b6a71cd1df519aaa175e842
        with:
          issue-number: ${{ inputs.issue-number }}
          stage: ${{ inputs.stage }}
