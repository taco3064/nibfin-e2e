name: Nibfin adopted stage
on:
  workflow_dispatch:
    inputs:
      issue-number: { required: true, type: string }
      stage: { required: true, type: string }
permissions:
  contents: read
  id-token: write
jobs:
  adopted-stage:
    runs-on: [self-hosted, nibfin-user-127829492]
    steps:
      - uses: taco3064/nibfin-act@a8ddbdd7f082f9c880b7fa21232e26a87001bf4c
        with:
          issue-number: ${{ inputs.issue-number }}
          stage: ${{ inputs.stage }}
