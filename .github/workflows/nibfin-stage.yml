name: Nibfin adopted stage
on:
  workflow_dispatch:
    inputs:
      issue-number: { required: true, type: string }
      stage: { required: true, type: string }
permissions:
  contents: read
  id-token: write
jobs:
  adopted-stage:
    runs-on: [self-hosted, nibfin-user-127829492]
    steps:
      - uses: taco3064/nibfin-act@86c57ce1cad7e6336435a026e066771ddd5a84e8
        with:
          issue-number: ${{ inputs.issue-number }}
          stage: ${{ inputs.stage }}
