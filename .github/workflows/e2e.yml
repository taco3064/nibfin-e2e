name: e2e

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
  && (github.event.action == 'issue-delivered'
  && format('e2e · retest {0}#{1}', github.event.client_payload.repository, github.event.client_payload.issue)
  || 'e2e · Proposal updated')
  || 'e2e · manual' }}

on:
  workflow_dispatch:
    inputs:
      rules:
        description: Proposal rule ids, separated by spaces or commas (for example "R5.13 R5.14")
        required: false
        default: ''
      sections:
        description: Proposal section numbers, separated by spaces or commas (for example "3 5"); rules and sections combine as a union, both empty runs --all
        required: false
        default: ''
      gh_nibfin_ref:
        description: gh-nibfin branch, tag or commit to build
        required: false
        default: main
  # issue-delivered: sent by nibfin-e2e-notify.yml in nibfin-core, gh-nibfin and this repository
  # (client_payload: repository, issue). proposal-updated: sent by the Notion relay
  # in relay/ (client_payload: page_id, block_ids, timestamp).
  repository_dispatch:
    types: [issue-delivered, proposal-updated]

# Only one run at a time may use the sandboxes (Proposal R8.19); later runs wait in
# line. A Proposal update touches no sandbox, so it gets a group of its own.
concurrency:
  group: >-
    ${{ github.event.action == 'proposal-updated'
    && format('e2e-proposal-{0}', github.run_id) || 'e2e-sandboxes' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  proposal-updated:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'proposal-updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: File the Proposal update request
        env:
          NIBFIN_GITHUB_TOKEN: ${{ secrets.NIBFIN_GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          npm run --silent gate -- proposal-updated > gate.json
          code=$?
          jq -r '.summary // empty' gate.json >> "$GITHUB_STEP_SUMMARY" || cat gate.json
          exit $code

  select:
    if: github.event.action != 'proposal-updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      execute: ${{ steps.plan.outputs.execute }}
      e2e: ${{ steps.e2e.outputs.sha }}
    steps:
      # A retest may wait in line for hours. It tests the newest main when it starts,
      # not the commit current when it was queued, so it never reports a stale failure.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'main' || github.sha }}
          persist-credentials: false
      - id: e2e
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.gh_nibfin_ref }}
        run: |
          set -euo pipefail
          ref="${REF:-main}"
          if [[ ! "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::gh_nibfin_ref has unsupported characters"; exit 2
          fi
          commit=$(gh api "repos/taco3064/gh-nibfin/commits/$ref" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve $ref"; exit 2; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "gh-nibfin $ref -> $commit" >> "$GITHUB_STEP_SUMMARY"
      - id: plan
        env:
          NIBFIN_GITHUB_TOKEN: ${{ secrets.NIBFIN_GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          RULES: ${{ inputs.rules }}
          SECTIONS: ${{ inputs.sections }}
          DELIVERED_REPO: ${{ github.event.client_payload.repository }}
          DELIVERED_ISSUE: ${{ github.event.client_payload.issue }}
        run: |
          set -uo pipefail
          args=()
          if [[ "$EVENT" == repository_dispatch ]]; then
            [[ "$DELIVERED_REPO" =~ ^taco3064/(nibfin-core|gh-nibfin|nibfin-e2e)$ && "$DELIVERED_ISSUE" =~ ^[0-9]+$ ]] \
              || { echo "::error::invalid issue-delivered payload"; exit 2; }
            args=(--delivered "$DELIVERED_REPO#$DELIVERED_ISSUE")
          else
            for r in ${RULES//,/ }; do
              [[ "$r" =~ ^R[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid rule id: $r"; exit 2; }
              args+=(--rule "$r")
            done
            for s in ${SECTIONS//,/ }; do
              [[ "$s" =~ ^[0-9]+$ ]] || { echo "::error::invalid section: $s"; exit 2; }
              args+=(--section "$s")
            done
            [[ ${#args[@]} -gt 0 ]] || args=(--all)
          fi
          npm run --silent gate -- select "${args[@]}" > plan.json
          code=$?
          echo "gate select exit code: $code"
          # 1 only means the coverage check failed; the plan is still valid and the
          # report job files what it found. 2 is a usage or input error: no plan.
          jq -e '.selection' plan.json > /dev/null 2>&1 || { cat plan.json; exit 2; }
          jq -r '.summary // empty' plan.json >> "$GITHUB_STEP_SUMMARY"
          echo "execute=$(jq -r '.execute' plan.json)" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: plan.json
          if-no-files-found: ignore

  run:
    needs: select
    if: needs.select.outputs.execute == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.select.outputs.e2e || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
          cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: gate
      - name: Run the harness
        env:
          E2E_SANDBOX_TOKEN: ${{ secrets.E2E_SANDBOX_TOKEN }}
          E2E_CLAUDE_TOKEN: ${{ secrets.E2E_CLAUDE_TOKEN }}
          E2E_PEER_GITHUB_TOKEN: ${{ secrets.E2E_PEER_GITHUB_TOKEN }}
          COMMIT: ${{ needs.select.outputs.commit }}
        run: |
          set -uo pipefail
          npm run --silent e2e -- --plan gate/plan.json --gh-nibfin-commit "$COMMIT" > result.json
          code=$?
          echo "harness exit code: $code"
          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.os }}
          path: result.json
          if-no-files-found: ignore
      - name: File this leg's requests
        if: always()
        timeout-minutes: 10
        env:
          NIBFIN_GITHUB_TOKEN: ${{ secrets.NIBFIN_GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p leg
          [[ -f result.json ]] && cp result.json leg/
          npm run --silent gate -- report --leg --results leg > leg-report.json
          code=$?
          jq -r '.summary // empty' leg-report.json >> "$GITHUB_STEP_SUMMARY" || cat leg-report.json
          exit $code

  # Files one request per root failure, failed job without a result and plan gap.
  # Runs even when earlier jobs fail, time out or are cancelled.
  report:
    needs: [select, run]
    if: always() && github.event.action != 'proposal-updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.select.outputs.e2e || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: plan
          path: gate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
      - name: Report and file requests
        env:
          NIBFIN_GITHUB_TOKEN: ${{ secrets.NIBFIN_GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p results
          plan=()
          [[ -f gate/plan.json ]] && plan=(--plan gate/plan.json)
          npm run --silent gate -- report "${plan[@]}" --results results > report.json
          code=$?
          jq -r '.summary // empty' report.json >> "$GITHUB_STEP_SUMMARY" || cat report.json
          exit $code
